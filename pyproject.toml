[project]
name = "vasuki"
version = "1.0.0"
description = "Ask a data file a question in plain words: typed plans, a deterministic engine, and the small VIC model that writes the plans"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.15"
keywords = ["tabular", "csv", "planner", "small-language-model", "local-llm", "mlx", "ollama", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# One step to a working `vasuki ask` and `vasuki-mcp`: on Apple silicon the model runner (MLX-LM) comes with
# the package, and so does the MCP library. The executor itself still imports neither.
dependencies = [
    "mlx-lm>=0.28; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/rahul05ranjan/vasuki-vic"
Documentation = "https://github.com/rahul05ranjan/vasuki-vic/tree/main/docs"
Model = "https://huggingface.co/rahul05ranjan/VIC-2B"
Changelog = "https://github.com/rahul05ranjan/vasuki-vic/blob/main/CHANGELOG.md"
Issues = "https://github.com/rahul05ranjan/vasuki-vic/issues"

[project.optional-dependencies]
# Kept so that older commands naming these extras still work; both are installed by default now.
mlx = ["mlx-lm>=0.28"]
mcp = ["mcp>=1.2"]

[project.scripts]
vasuki = "vasuki.cli:main"
vasuki-mcp = "vasuki.mcp_server:main"

[dependency-groups]
# Only the benchmark in bench/ needs these; the executor in the vasuki package has no dependencies.
bench = ["anthropic>=1.0", "pandas>=2.2"]
dev = ["pytest>=8", "mcp>=1.2", { include-group = "bench" }]
# Fine-tuning on Apple silicon. Install with `uv sync --group train`.
train = ["mlx-lm>=0.28"]
# Training on Kaggle's NVIDIA GPUs: the Kaggle CLI, plus PyTorch and PEFT to smoke-test kaggle/train_vic.py here.
kaggle = ["kaggle>=1.6", "torch>=2.4", "peft>=0.13", "accelerate>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vasuki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
