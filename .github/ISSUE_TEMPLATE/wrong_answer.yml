name: Wrong answer from the model
description: The plan ran, and the table it returned is not what the request asked for
labels: [model]
body:
  - type: textarea
    id: request
    attributes:
      label: The request
      description: Exactly as you wrote it.
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: The plan the model wrote
      description: Run the request again with --show-plan.
      render: json
    validations:
      required: true
  - type: textarea
    id: columns
    attributes:
      label: The table's columns
      description: Column names and types, and a few sample rows if they are not private.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What the answer should have been
