<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">vasuki</title>
  <desc id="d">Ask a table a question in plain words. A small local model writes a typed plan and a deterministic engine runs it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1E"/>
      <stop offset="1" stop-color="#13203D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <path d="M-20 372 C 140 312, 260 432, 420 372 S 700 312, 860 372 S 1140 432, 1300 372" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.28"/>
  <path d="M-20 390 C 140 330, 260 450, 420 390 S 700 330, 860 390 S 1140 450, 1300 390" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.16"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="64" y="62" width="196" height="32" rx="16" fill="#2DD4BF" fill-opacity="0.12" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="162" y="83" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="1.2" fill="#5EEAD4">VIC-2B  ·  APACHE 2.0</text>
    <text x="60" y="186" font-size="92" font-weight="700" letter-spacing="-3" fill="#FFFFFF">vasuki</text>
    <rect x="64" y="208" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="64" y="252" font-size="24" font-weight="500" fill="#E2E8F0">Ask a table a question in plain words.</text>
    <text x="64" y="286" font-size="18" fill="#94A3B8">A 1.55 GB model on your machine writes a typed plan.</text>
    <text x="64" y="312" font-size="18" fill="#94A3B8">A deterministic engine checks it and runs it.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect x="700" y="52" width="516" height="74" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="722" y="80" font-size="11" letter-spacing="1.5" fill="#64748B">REQUEST</text>
    <text x="722" y="106" fill="#E2E8F0">Total amount per vendor, highest first.</text>

    <path d="M958 126 v22" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M952 142 l6 8 l6 -8" fill="none" stroke="#2DD4BF" stroke-width="2"/>

    <rect x="700" y="152" width="516" height="74" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#2DD4BF" stroke-opacity="0.45"/>
    <text x="722" y="180" font-size="11" letter-spacing="1.5" fill="#5EEAD4">PLAN  ·  WRITTEN BY VIC, CHECKED BEFORE IT RUNS</text>
    <text x="722" y="206" fill="#E2E8F0">aggregate(vendor, sum amount)  →  sort(desc)</text>

    <path d="M958 226 v22" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M952 242 l6 8 l6 -8" fill="none" stroke="#2DD4BF" stroke-width="2"/>

    <rect x="700" y="252" width="516" height="126" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <text x="722" y="280" font-size="11" letter-spacing="1.5" fill="#64748B">RESULT  ·  COMPUTED LOCALLY, THE FILE NEVER LEAVES</text>
    <text x="722" y="306" fill="#64748B">vendor</text><text x="960" y="306" text-anchor="end" fill="#64748B">total_amount</text>
    <text x="722" y="328" fill="#E2E8F0">Acme</text><text x="960" y="328" text-anchor="end" fill="#E2E8F0">2500.0</text>
    <text x="722" y="348" fill="#E2E8F0">Bolt</text><text x="960" y="348" text-anchor="end" fill="#E2E8F0">500.5</text>
    <text x="722" y="368" fill="#E2E8F0">Cora</text><text x="960" y="368" text-anchor="end" fill="#E2E8F0">0</text>
  </g>
</svg>
